workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Paws New Home

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.anna.pawswithoutborders
      flutter: stable
      xcode: 16.3
      cocoapods: default

    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Set up code signing
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Install dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Generate launcher icons
        script: |
          flutter pub run flutter_launcher_icons

      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign

      - name: Export IPA
        script: |
          xcode-project build-ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
