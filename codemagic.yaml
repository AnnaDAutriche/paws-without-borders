workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Paws New Home
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.anna.pawswithoutborders
      vars:
        APP_STORE_CONNECT_KEY_IDENTIFIER: V8XP3UYRPK
        APP_STORE_CONNECT_ISSUER_ID: 5300fe45-7ccf-4ac0-acce-d0e6ca9fe77c
        APP_STORE_CONNECT_PRIVATE_KEY: 
        BUNDLE_ID: com.anna.pawswithoutborders
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Use signing files
        script: keychain add-certificates
      - name: Set up code signing settings
        script: xcode-project use-profiles
      - name: Install dependencies
        script: flutter pub get
      - name: Generate launcher icons
        script: flutter pub run flutter_launcher_icons
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
          cd ios && xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath "$CM_BUILD_DIR/Runner.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain=$HOME/Library/Keychains/login.keychain-db"
      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/Runner.xcarchive" \
            --archive-path "$CM_BUILD_DIR/Runner.xcarchive"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
